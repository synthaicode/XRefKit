name: python-package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-distribution:
    name: Build Python distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("xrefkit-*.whl"))
          sdists = list(dist.glob("xrefkit-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist: wheels={wheels}, sdists={sdists}")

          required = {
              "xrefkit/resources/base/current.json",
              "xrefkit/resources/base/contracts.json",
              "xrefkit/resources/base/model_body.md",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"wheel is missing runtime resources: {missing}")
              if any(name.endswith((".pyc", ".pyo")) or "__pycache__" in name for name in names):
                  raise SystemExit("wheel contains generated Python cache files")

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = {name.split("/", 1)[-1] for name in archive.getnames() if "/" in name}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"sdist is missing runtime resources: {missing}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xrefkit-python-distribution
          path: dist/
          if-no-files-found: error

  installed-package-smoke:
    name: Installed package / Python ${{ matrix.python-version }}
    needs: build-distribution
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: xrefkit-python-distribution
          path: dist
      - name: Install wheel with MCP extras
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name 'xrefkit-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "${wheel}[mcp]"
      - name: Verify installed package outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib import metadata, resources
          import json
          import xrefkit
          import xrefkit.mcp.server
          import xrefkit.tools

          version = metadata.version("xrefkit")
          if version != xrefkit.__version__:
              raise SystemExit(
                  f"metadata/package version mismatch: metadata={version}, package={xrefkit.__version__}"
              )

          base = resources.files("xrefkit").joinpath("resources/base")
          current = json.loads(base.joinpath("current.json").read_text(encoding="utf-8"))
          if not current.get("generation"):
              raise SystemExit("installed current.json has no generation pointer")
          if not base.joinpath("contracts.json").is_file():
              raise SystemExit("installed package has no contracts.json")
          if not base.joinpath("model_body.md").is_file():
              raise SystemExit("installed package has no model_body.md")
          PY
          xrefkit --help
          python -m xrefkit --help

  source-distribution-install:
    name: Install source distribution
    needs: build-distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: xrefkit-python-distribution
          path: dist
      - name: Build and install from sdist
        shell: bash
        run: |
          sdist="$(find dist -maxdepth 1 -name 'xrefkit-*.tar.gz' -print -quit)"
          test -n "$sdist"
          python -m pip install "$sdist"
          python -c "from importlib.metadata import version; import xrefkit; assert version('xrefkit') == xrefkit.__version__"
          xrefkit --help
