name: python-package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  PYTHON_PACKAGE_ROOT: .
  PYTHON_PACKAGE_PROJECT: pyproject.toml
  PYTHON_PROJECT_NAME: xrefkit
  PYTHON_PACKAGE_MODULE: xrefkit
  PYTHON_SOURCE_ROOT: xrefkit

jobs:
  quality:
    name: Test and security quality
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2; pinned to the release commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v6.3.0; pinned to the release commit.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install project, test, and security dependencies
        working-directory: ${{ env.PYTHON_PACKAGE_ROOT }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test,mcp]"
          python -m pip install bandit pip-audit
      - name: Run existing repository quality gate and tests
        run: python tools/run_quality_gate.py xrefkit
      - name: Run Bandit source security scan
        run: |
          # -ll makes medium/high findings release-blocking. The repository
          # currently has reviewed low-severity findings (asserts and explicit
          # subprocess calls); they remain visible in local full scans.
          bandit -r "${PYTHON_SOURCE_ROOT}" -ll
      - name: Audit declared runtime dependencies
        run: |
          # There is no lock file. requirements.txt is the repository's
          # declared runtime dependency set, while the local audit below also
          # covers the installed optional mcp extra.
          python -m pip_audit \
            -r requirements.txt \
            --cache-dir "${RUNNER_TEMP}/pip-audit-requirements-cache"
      - name: Audit resolved installed dependencies and optional extras
        shell: bash
        run: |
          set -euo pipefail
          audit_venv="${RUNNER_TEMP}/xrefkit-pip-audit-venv"
          python -m venv "$audit_venv"
          "$audit_venv/bin/python" -m pip install --upgrade pip
          "$audit_venv/bin/python" -m pip install -e ".[test,mcp]"
          "$audit_venv/bin/python" -m pip install pip-audit
          "$audit_venv/bin/python" -m pip_audit \
            --local \
            --skip-editable \
            --cache-dir "${RUNNER_TEMP}/pip-audit-local-cache"

  build-distribution:
    name: Build Python wheel and sdist once
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2; pinned to the release commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v6.3.0; pinned to the release commit.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify Python package project
        shell: bash
        run: |
          project="${PYTHON_PACKAGE_ROOT}/${PYTHON_PACKAGE_PROJECT}"
          test -f "$project" || {
            echo "::error::Python package project was not found: $project"
            exit 1
          }
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"Python package tag must start with 'v': {tag}")

          project_file = (
              Path(os.environ["PYTHON_PACKAGE_ROOT"])
              / os.environ["PYTHON_PACKAGE_PROJECT"]
          )
          package_version = tomllib.loads(
              project_file.read_text(encoding="utf-8")
          )["project"]["version"]
          tag_version = tag.removeprefix("v")
          if tag_version != package_version:
              raise SystemExit(
                  "tag/package version mismatch: "
                  f"tag={tag_version}, {project_file}={package_version}"
              )

          print(f"tag/package version match: {package_version}")
          PY
      - name: Build wheel and source distribution exactly once
        working-directory: ${{ env.PYTHON_PACKAGE_ROOT }}
        run: python -m build
      - name: Validate distribution metadata
        working-directory: ${{ env.PYTHON_PACKAGE_ROOT }}
        run: python -m twine check dist/*
      # actions/upload-artifact v4.6.2; pinned to the release commit.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xrefkit-python-distribution
          path: ${{ env.PYTHON_PACKAGE_ROOT }}/dist/
          if-no-files-found: error

  artifact-inspection:
    name: Inspect built artifacts and scan for malware/secrets
    needs: build-distribution
    runs-on: ubuntu-latest
    steps:
      # The checkout supplies only the repository-owned inspection script; the
      # files under test always come from the build job artifact.
      # actions/checkout v4.2.2; pinned to the release commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v6.3.0; pinned to the release commit.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      # actions/download-artifact v8.0.0; pinned to the release commit.
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: xrefkit-python-distribution
          path: dist
      - name: Validate artifact allowlist, metadata, archives, and credentials
        run: |
          # The current package has Python/resources only and no large binary
          # payloads; 5 MiB is an explicit unexpected-file size ceiling.
          python tools/inspect_python_artifacts.py \
            --dist dist \
            --project-name "${PYTHON_PROJECT_NAME}" \
            --package-module "${PYTHON_PACKAGE_MODULE}" \
            --required-member xrefkit/resources/base/current.json \
            --required-member xrefkit/resources/base/contracts.json \
            --required-member xrefkit/resources/base/model_body.md \
            --manifest-output artifact-manifest.txt
      - name: Install ClamAV and update virus definitions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clamav clamav-freshclam
            # Use the package's standard config path, removing only its
            # example marker, and pass a job-local database path explicitly.
            clam_db_dir="/tmp/xrefkit-clamav-${GITHUB_RUN_ID}"
            sudo install -d -o clamav -g clamav -m 0755 "${clam_db_dir}"
            sudo sed -i -E '/^[[:space:]]*Example[[:space:]]*$/d' /etc/clamav/freshclam.conf
          if command -v systemctl >/dev/null 2>&1 && \
             sudo systemctl cat clamav-freshclam.service >/dev/null 2>&1; then
            sudo systemctl stop clamav-freshclam.service
          fi
          if pgrep -x freshclam >/dev/null 2>&1; then
            echo "::error::freshclam background updater is still running after service stop"
            exit 1
          fi
          # A failed definition update must fail this job; malware scanning
          # has no success fallback. Bound the external update to a clear
            # failure instead of allowing a runner to stall indefinitely.
            timeout --signal=TERM --kill-after=30s 10m \
              sudo freshclam --config-file=/etc/clamav/freshclam.conf --datadir="${clam_db_dir}" --stdout --verbose
      - name: Scan built artifacts with ClamAV
        shell: bash
        run: |
          set -euo pipefail
            clam_db_dir="/tmp/xrefkit-clamav-${GITHUB_RUN_ID}"
          if clamscan --help | grep -Fq -- "--fail-if-cvd-older-than"; then
            clamscan --database="${clam_db_dir}" --recursive --infected --fail-if-cvd-older-than=1 dist/
          else
            echo "::warning::ClamAV lacks --fail-if-cvd-older-than; freshclam succeeded, using recursive infected scan."
            clamscan --database="${clam_db_dir}" --recursive --infected dist/
          fi
      # actions/upload-artifact v4.6.2; pinned to the release commit.
      - name: Upload artifact member manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xrefkit-python-artifact-manifest
          path: artifact-manifest.txt
          if-no-files-found: error

  install-smoke-test:
    name: Clean wheel install/import / Python ${{ matrix.python-version }}
    needs: build-distribution
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # actions/checkout v4.2.2; pinned to the release commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v6.3.0; pinned to the release commit.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      # actions/download-artifact v8.0.0; pinned to the release commit.
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: xrefkit-python-distribution
          path: dist
      - name: Install the built wheel in a new virtual environment
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/xrefkit-wheel-smoke"
          work="${RUNNER_TEMP}/xrefkit-wheel-smoke-work"
          python -m venv "$venv"
          mkdir -p "$work"
          wheel="$(find "${GITHUB_WORKSPACE}/dist" -maxdepth 1 -name 'xrefkit-*.whl' -print -quit)"
          test -f "$wheel"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install "${wheel}[mcp]"
          cd "$work"
          "$venv/bin/python" -B "${GITHUB_WORKSPACE}/tools/run_import_smoke.py" \
            --package-name xrefkit \
            --import-module xrefkit \
            --import-module xrefkit.mcp.server \
            --import-module xrefkit.tools \
            --version-module xrefkit
          "$venv/bin/xrefkit" --help
          "$venv/bin/python" -B -m xrefkit --help

  sdist-install-smoke:
    name: Clean sdist install/import
    needs: build-distribution
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2; pinned to the release commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v6.3.0; pinned to the release commit.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      # actions/download-artifact v8.0.0; pinned to the release commit.
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: xrefkit-python-distribution
          path: dist
      - name: Install the built sdist in a new virtual environment
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/xrefkit-sdist-smoke"
          work="${RUNNER_TEMP}/xrefkit-sdist-smoke-work"
          python -m venv "$venv"
          mkdir -p "$work"
          sdist="$(find "${GITHUB_WORKSPACE}/dist" -maxdepth 1 -name 'xrefkit-*.tar.gz' -print -quit)"
          test -f "$sdist"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install "${sdist}[mcp]"
          cd "$work"
          "$venv/bin/python" -B "${GITHUB_WORKSPACE}/tools/run_import_smoke.py" \
            --package-name xrefkit \
            --import-module xrefkit \
            --import-module xrefkit.mcp.server \
            --import-module xrefkit.tools \
            --version-module xrefkit
          "$venv/bin/xrefkit" --help

  publish-to-pypi:
    name: Publish package to PyPI
    needs:
      - quality
      - build-distribution
      - artifact-inspection
      - install-smoke-test
      - sdist-install-smoke
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xrefkit
    permissions:
      contents: write
      id-token: write
    steps:
      # actions/checkout v4.2.2; pinned to the release commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/download-artifact v8.0.0; pinned to the release commit.
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: xrefkit-python-distribution
          path: dist
      - name: Create GitHub Release when missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
      - name: Attach Python distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
      - name: Build Skill and Knowledge bundle archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for bundle in brownfield csharp batch-regression; do
            package_root="packages/xrefkit-skills-${bundle}/src"
            source_root="${package_root}/xrefkit_skills_${bundle//-/_}"
            bundle_root="bundle/xrefkit-skills-${bundle}"
            test -d "${source_root}/skills"
            mkdir -p "${bundle_root}"
            for directory in skills knowledge review_axes schemas; do
              if [[ -d "${source_root}/${directory}" ]]; then
                cp -R "${source_root}/${directory}" "${bundle_root}/"
              fi
            done
            if [[ -f "${source_root}/package_manifest.yaml" ]]; then
              cp "${source_root}/package_manifest.yaml" "${bundle_root}/"
            fi
            archive="xrefkit-skills-${bundle}-${version}.zip"
            (cd bundle && zip -qr "../${archive}" "xrefkit-skills-${bundle}")
            test -s "${archive}"
          done
      - name: Attach Skill and Knowledge bundles to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" xrefkit-skills-*.zip --clobber
      - name: Publish the inspected build artifact to PyPI
        # pypa/gh-action-pypi-publish v1.14.0; pinned to the release commit.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
          skip-existing: false
          verify-metadata: true
          print-hash: true
