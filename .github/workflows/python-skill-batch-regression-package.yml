name: python-skill-batch-regression-package

on:
  push:
    tags:
      - "xrefkit-skills-batch-regression-v*.*.*"

permissions:
  contents: read

env:
  PACKAGE_ROOT: packages/xrefkit-skills-batch-regression
  PACKAGE_PROJECT: packages/xrefkit-skills-batch-regression/pyproject.toml

jobs:
  build-distribution:
    name: Build batch regression Skill Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Verify package tag and version
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          prefix = "xrefkit-skills-batch-regression-v"
          if not tag.startswith(prefix):
              raise SystemExit(f"unexpected Skill Package tag: {tag}")
          expected = tag.removeprefix(prefix)
          project = Path(os.environ["PACKAGE_PROJECT"])
          actual = tomllib.loads(project.read_text(encoding="utf-8"))["project"]["version"]
          if actual != expected:
              raise SystemExit(f"tag/package version mismatch: tag={expected}, package={actual}")
          print(f"tag/package version match: {actual}")
          PY
      - name: Build distribution
        working-directory: ${{ env.PACKAGE_ROOT }}
        run: python -m build
      - name: Validate distribution metadata
        working-directory: ${{ env.PACKAGE_ROOT }}
        run: python -m twine check dist/*
      - name: Verify Skill Package contents
        working-directory: ${{ env.PACKAGE_ROOT }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("xrefkit_skills_batch_regression-*.whl"))
          sdists = list(dist.glob("xrefkit_skills_batch_regression-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist: wheels={wheels}, sdists={sdists}")
          required = {
              "xrefkit_skills_batch_regression/package_manifest.yaml",
              "xrefkit_skills_batch_regression/skills/batch_impact_regression.skill.yaml",
              "xrefkit_skills_batch_regression/skill_assets/entry.md",
              "xrefkit_skills_batch_regression/skill_assets/scripts/batch_regression.py",
              "xrefkit_skills_batch_regression/skill_assets/scripts/code_tables.py",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              missing = sorted(required - set(archive.namelist()))
              if missing:
                  raise SystemExit(f"wheel is missing Skill Package assets: {missing}")
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = {name.split("/", 1)[-1] for name in archive.getnames() if "/" in name}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"sdist is missing Skill Package assets: {missing}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xrefkit-skills-batch-regression-distribution
          path: ${{ env.PACKAGE_ROOT }}/dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish batch regression Skill Package to PyPI
    needs: build-distribution
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xrefkit-skills-batch-regression
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xrefkit-skills-batch-regression-distribution
          path: dist
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
