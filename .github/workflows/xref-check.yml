name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  xrefkit-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run XRefKit quality gate
        run: |
          python tools/run_quality_gate.py xrefkit

  slides-app-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/slides-app/package-lock.json
      - name: Run standardized quality gate
        run: python tools/run_quality_gate.py slides-app --install-node-deps
