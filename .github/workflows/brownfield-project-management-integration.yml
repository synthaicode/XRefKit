name: Brownfield and Project Management integration

on:
  workflow_call:
    inputs:
      distribution_artifact:
        required: true
        type: string
      companion_project:
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: ${{ inputs.distribution_artifact }}
          path: integration-dist
      - name: Build companion and install both wheels with released Core
        env:
          COMPANION_PROJECT: ${{ inputs.companion_project }}
        run: |
          python -m pip install build pytest
          python -m build --wheel --outdir integration-dist "$COMPANION_PROJECT"
          python -m pip install integration-dist/*.whl
          python -m pip check
      - name: Run installed contract and integration tests
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m pytest "${GITHUB_WORKSPACE}/integration/brownfield_project_management/tests" --import-mode=importlib -o pythonpath= -q
      - name: Verify Brownfield optional dependency is publicly installable
        if: startsWith(github.ref, 'refs/tags/xrefkit-skills-brownfield-v')
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m venv public-extra
          wheel="$(find "${GITHUB_WORKSPACE}/integration-dist" -name 'xrefkit_skills_brownfield-*.whl' -print -quit)"
          public-extra/bin/python -m pip install "${wheel}[project-management]"
          public-extra/bin/python -m pip check
