name: publish-xrefkit-openai-runtime

on:
  pull_request:
    paths:
      - "packages/xrefkit-openai-runtime/**"
      - ".github/workflows/publish-xrefkit-openai-runtime.yml"
      - "tools/verify_runtime_wheel.py"
      - "tests/test_verify_runtime_wheel.py"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact Runtime package version to verify"
        required: true
        type: string
      publish:
        description: "Publish the approved candidate from the specified run to PyPI"
        type: boolean
        default: false
      candidate_run_id:
        description: "Run containing the wheel verified in #250 (omit both candidate inputs to build only)"
        type: string
      candidate_commit:
        description: "Full commit SHA holding the accepted local wheel in dist/ (alternative to candidate_run_id)"
        type: string
      wheel_sha256:
        description: "SHA-256 of the wheel recorded at #250 acceptance (also required for a handoff dry run)"
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Runtime / Verify publish artifact
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      HANDOFF: ${{ inputs.publish == true || inputs.candidate_run_id != '' || inputs.candidate_commit != '' || inputs.wheel_sha256 != '' }}
      SOURCE_COMMIT: ${{ inputs.candidate_commit }}
      SOURCE_RUN_ID: ${{ inputs.candidate_run_id }}
      EXPECTED_SHA256: ${{ inputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.9"
          architecture: x64
      - name: Check distribution identity and build
        if: env.HANDOFF != 'true'
        shell: pwsh
        run: |
          python -c "import os, pathlib, tomllib; p=tomllib.loads(pathlib.Path('packages/xrefkit-openai-runtime/pyproject.toml').read_text())['project']; expected=os.environ.get('EXPECTED_VERSION'); assert p['name']=='xrefkit-openai-runtime' and (not expected or expected==p['version']), 'Unexpected project or version'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip wheel --no-deps --wheel-dir dist packages/xrefkit-openai-runtime
          exit $LASTEXITCODE
      - name: Require candidate coordinates
        if: env.HANDOFF == 'true'
        shell: pwsh
        run: |
          $fromRun = $env:SOURCE_RUN_ID -match '\A[1-9][0-9]*\z' -and !$env:SOURCE_COMMIT
          $fromCommit = $env:SOURCE_COMMIT -match '\A[0-9a-f]{40}\z' -and !$env:SOURCE_RUN_ID
          if ((!$fromRun -and !$fromCommit) -or
              $env:EXPECTED_SHA256 -notmatch '\A[0-9a-fA-F]{64}\z' -or
              [string]::IsNullOrWhiteSpace($env:EXPECTED_VERSION)) {
            throw 'Provide exactly one original candidate run or commit, accepted wheel SHA-256 and exact package version'
          }
      - name: Fetch accepted local wheel from immutable commit
        if: env.SOURCE_COMMIT != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_commit }}
          path: accepted
          sparse-checkout: dist
          persist-credentials: false
      - name: Stage the accepted distribution
        if: env.SOURCE_COMMIT != ''
        shell: pwsh
        run: Copy-Item -LiteralPath accepted/dist -Destination dist -Recurse -ErrorAction Stop
      - name: Download original candidate
        if: env.SOURCE_RUN_ID != ''
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: xrefkit-openai-runtime-wheel
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Compare downloaded wheel against the accepted candidate
        if: env.HANDOFF == 'true'
        run: python -I tools/verify_runtime_wheel.py
      - name: Verify the built wheel
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist -Filter *.whl)
          if ($wheels.Count -ne 1 -or $wheels[0].Name -notlike 'xrefkit_openai_runtime-*.whl') {
            throw 'Expected exactly one Runtime wheel'
          }
          python -m pip install $wheels[0].FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I -c "import hashlib; from xrefkit_openai_runtime.distribution import CORE_LOCK, STARTUP_CONTRACT, STARTUP_SHA256; assert hashlib.sha256(CORE_LOCK.read_bytes()).hexdigest() == '7d52e966e76e1134f66b14ed2516deb4b2b2655cc7852d76158f0288cce7e740'; assert hashlib.sha256(STARTUP_CONTRACT.read_bytes()).hexdigest() == STARTUP_SHA256"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          xrefkit-openai-runtime-core --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          xrefkit-openai-runtime-desktop --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash $wheels[0].FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xrefkit-openai-runtime-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Runtime / Publish to PyPI
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xrefkit-openai-runtime/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: xrefkit-openai-runtime-wheel
          path: dist
      - name: Verify exact upload contents
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.wheel_sha256 }}
        run: python3 -I tools/verify_runtime_wheel.py
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
          skip-existing: false
          verify-metadata: true
          print-hash: true
