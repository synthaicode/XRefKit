name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "tools/site_build.py"
      - "tools/site_release_metadata.py"
      - ".github/workflows/pages.yml"
      - "human-docs/en/assets/063_ai_organization_explainer_clear/**"
      - "human-docs/en/assets/064_ai_team_operating_boundary/**"
      - "human-docs/en/assets/065_xrefkit_repository_overview/**"
      - "human-docs/en/assets/073_xrefkit_organization_distribution/**"
      - "human-docs/en/assets/055_why_ai_organization_needed/**"
      - "human-docs/ja/assets/063_ai_organization_explainer_clear/**"
      - "human-docs/ja/assets/064_ai_team_operating_boundary/**"
      - "human-docs/ja/assets/065_xrefkit_repository_overview/**"
      - "human-docs/ja/assets/073_xrefkit_organization_distribution/**"
      - "human-docs/ja/assets/055_why_ai_organization_needed/**"
      - "human-docs/ja/assets/054_why_ai_organization_needed/**"
      - "human-docs/en/video/063_ai_organization_explainer_clear/**"
      - "human-docs/en/video/064_ai_team_operating_boundary/**"
      - "human-docs/en/video/065_xrefkit_repository_overview/**"
      - "human-docs/en/video/073_xrefkit_organization_distribution/**"
      - "human-docs/ja/video/063_ai_organization_explainer_clear/**"
      - "human-docs/ja/video/064_ai_team_operating_boundary/**"
      - "human-docs/ja/video/065_xrefkit_repository_overview/**"
      - "human-docs/ja/video/073_xrefkit_organization_distribution/**"
  release:
    types: [published, edited, released, deleted, unpublished]
  # Releases created with GITHUB_TOKEN do not emit downstream release runs.
  workflow_run:
    workflows: [python-package]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release events point at a tag. Always publish current site sources.
          ref: main
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and verify site
        run: |
          python tools/site_build.py --output .generated-site --json
          python tools/site_build.py --output site --check --json

      - name: Render current stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$RELEASE_REPOSITORY/releases/latest" > "$RUNNER_TEMP/site-release.json"
          python tools/site_release_metadata.py --site .generated-site --release-json "$RUNNER_TEMP/site-release.json" --repository "$RELEASE_REPOSITORY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .generated-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
