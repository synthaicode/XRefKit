<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e32"/>
      <stop offset="100%" style="stop-color:#16162a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="70" x2="1000" y2="70"/>
    <line x1="0" y1="140" x2="1000" y2="140"/>
    <line x1="0" y1="210" x2="1000" y2="210"/>
    <line x1="0" y1="280" x2="1000" y2="280"/>
    <line x1="0" y1="350" x2="1000" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="420" fill="#4ade80" opacity="0.8"/>

  <!-- === LEFT SIDE: Text === -->

  <!-- Tag -->
  <rect x="48" y="52" width="110" height="26" rx="13" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-opacity="0.4" stroke-width="1"/>
  <text x="103" y="69" font-family="'Courier New', monospace" font-size="12" fill="#4ade80" text-anchor="middle" letter-spacing="1">AI AGENTS</text>

  <!-- Main title line 1 -->
  <text x="48" y="130" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.5">I Asked AI to Do</text>

  <!-- 10 — highlighted -->
  <text x="48" y="185" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#4ade80" filter="url(#softglow)">10 Things.</text>

  <!-- Line 3 -->
  <text x="48" y="238" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.5">It Stopped at 5.</text>

  <!-- Subtitle -->
  <text x="48" y="295" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#94a3b8" letter-spacing="0.2">The structural fix for agents that quit early.</text>

  <!-- Bottom label -->
  <text x="48" y="375" font-family="'Courier New', monospace" font-size="13" fill="#475569" letter-spacing="1">EXECUTOR · CHECKER · CLOSURE GATE</text>

  <!-- === RIGHT SIDE: Checklist card === -->
  <rect x="600" y="40" width="360" height="340" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Card header -->
  <rect x="600" y="40" width="360" height="46" rx="12" fill="#252540"/>
  <rect x="600" y="74" width="360" height="12" fill="#252540"/>
  <circle cx="628" cy="63" r="7" fill="#ff5f57"/>
  <circle cx="652" cy="63" r="7" fill="#febc2e"/>
  <circle cx="676" cy="63" r="7" fill="#28c840"/>
  <text x="780" y="68" font-family="'Courier New', monospace" font-size="12" fill="#475569" text-anchor="middle">task_list.md</text>

  <!-- Checklist items -->
  <!-- Item 1 - done -->
  <rect x="628" y="104" width="18" height="18" rx="3" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-width="1.5"/>
  <text x="637" y="117" font-family="Arial" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="bold">✓</text>
  <text x="660" y="117" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8">function_01</text>
  <text x="910" y="117" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" text-anchor="end">done</text>

  <!-- Item 2 - done -->
  <rect x="628" y="132" width="18" height="18" rx="3" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-width="1.5"/>
  <text x="637" y="145" font-family="Arial" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="bold">✓</text>
  <text x="660" y="145" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8">function_02</text>
  <text x="910" y="145" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" text-anchor="end">done</text>

  <!-- Item 3 - done -->
  <rect x="628" y="160" width="18" height="18" rx="3" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-width="1.5"/>
  <text x="637" y="173" font-family="Arial" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="bold">✓</text>
  <text x="660" y="173" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8">function_03</text>
  <text x="910" y="173" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" text-anchor="end">done</text>

  <!-- Item 4 - done -->
  <rect x="628" y="188" width="18" height="18" rx="3" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-width="1.5"/>
  <text x="637" y="201" font-family="Arial" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="bold">✓</text>
  <text x="660" y="201" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8">function_04</text>
  <text x="910" y="201" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" text-anchor="end">done</text>

  <!-- Item 5 - done -->
  <rect x="628" y="216" width="18" height="18" rx="3" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-width="1.5"/>
  <text x="637" y="229" font-family="Arial" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="bold">✓</text>
  <text x="660" y="229" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8">function_05</text>
  <text x="910" y="229" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" text-anchor="end">done</text>

  <!-- Divider -->
  <line x1="620" y1="252" x2="948" y2="252" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Item 6 - empty (problem zone) -->
  <rect x="628" y="260" width="18" height="18" rx="3" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="660" y="273" font-family="'Courier New', monospace" font-size="13" fill="#475569">function_06</text>
  <text x="910" y="273" font-family="'Courier New', monospace" font-size="11" fill="#ef4444" text-anchor="end">—</text>

  <!-- Item 7 - empty -->
  <rect x="628" y="288" width="18" height="18" rx="3" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="660" y="301" font-family="'Courier New', monospace" font-size="13" fill="#475569">function_07</text>
  <text x="910" y="301" font-family="'Courier New', monospace" font-size="11" fill="#ef4444" text-anchor="end">—</text>

  <!-- Item 8 - empty -->
  <rect x="628" y="316" width="18" height="18" rx="3" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="660" y="329" font-family="'Courier New', monospace" font-size="13" fill="#475569">function_08</text>
  <text x="910" y="329" font-family="'Courier New', monospace" font-size="11" fill="#ef4444" text-anchor="end">—</text>

  <!-- AI "done" badge — wrong -->
  <rect x="628" y="350" width="300" height="22" rx="4" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="778" y="365" font-family="'Courier New', monospace" font-size="12" fill="#ef4444" text-anchor="middle" letter-spacing="0.5">AI: "Task complete." ← ?</text>

  <!-- XRefKit label bottom right -->
  <text x="952" y="410" font-family="'Courier New', monospace" font-size="11" fill="#334155" text-anchor="end">github.com/synthaicode/XRefKit</text>
</svg>
