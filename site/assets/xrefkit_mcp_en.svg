<svg width="680" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<title>XRefKit MCP delivery model</title>
<desc>Governed XRefKit assets are discovered, selected, and resolved through a read-only MCP boundary, delivering the same governed assets to multiple AI clients. Execution and side effects stay client-side</desc>
<style>
.th{font:500 14px system-ui,-apple-system,sans-serif}
.ts{font:400 12px system-ui,-apple-system,sans-serif}
.zone{fill:none;stroke:#73726c;stroke-width:.5;stroke-dasharray:6 4}
.zl{fill:#444441}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.bt{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.tt1{fill:#085041}.tt2{fill:#0F6E56}
.bg{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.tg1{fill:#444441}.tg2{fill:#5F5E5A}
@media (prefers-color-scheme: dark){
.zone{stroke:#9c9a92}.zl{fill:#D3D1C7}.arr{stroke:#9c9a92}
.bt{fill:#085041;stroke:#9FE1CB}.tt1{fill:#9FE1CB}.tt2{fill:#5DCAA5}
.bg{fill:#444441;stroke:#D3D1C7}.tg1{fill:#D3D1C7}.tg2{fill:#B4B2A9}
}
</style>
<defs><marker id="xrk-arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="zone" x="40" y="60" width="210" height="364" rx="12"/>
<text class="th zl" x="56" y="84">XRefKit — governed assets</text>

<g>
  <rect class="bt" x="60" y="96" width="170" height="56" rx="8"/>
  <text class="th tt1" x="145" y="114" text-anchor="middle" dominant-baseline="central">Skills</text>
  <text class="ts tt2" x="145" y="134" text-anchor="middle" dominant-baseline="central">with runtime contracts</text>
</g>
<g>
  <rect class="bg" x="60" y="160" width="170" height="56" rx="8"/>
  <text class="th tg1" x="145" y="178" text-anchor="middle" dominant-baseline="central">Knowledge</text>
  <text class="ts tg2" x="145" y="198" text-anchor="middle" dominant-baseline="central">sourced facts</text>
</g>
<g>
  <rect class="bg" x="60" y="224" width="170" height="56" rx="8"/>
  <text class="th tg1" x="145" y="242" text-anchor="middle" dominant-baseline="central">Runtime contracts</text>
  <text class="ts tg2" x="145" y="262" text-anchor="middle" dominant-baseline="central">progression rules</text>
</g>
<g>
  <rect class="bg" x="60" y="288" width="170" height="56" rx="8"/>
  <text class="th tg1" x="145" y="306" text-anchor="middle" dominant-baseline="central">Catalog</text>
  <text class="ts tg2" x="145" y="326" text-anchor="middle" dominant-baseline="central">index without bodies</text>
</g>
<g>
  <rect class="bg" x="60" y="352" width="170" height="56" rx="8"/>
  <text class="th tg1" x="145" y="370" text-anchor="middle" dominant-baseline="central">XID</text>
  <text class="ts tg2" x="145" y="390" text-anchor="middle" dominant-baseline="central">stable references</text>
</g>

<g>
  <rect class="bg" x="270" y="186" width="140" height="112" rx="8"/>
  <text class="th tg1" x="340" y="206" text-anchor="middle" dominant-baseline="central">MCP</text>
  <text class="ts tg2" x="340" y="230" text-anchor="middle" dominant-baseline="central">discover · select</text>
  <text class="ts tg2" x="340" y="248" text-anchor="middle" dominant-baseline="central">resolve · deliver</text>
  <text class="ts tg2" x="340" y="266" text-anchor="middle" dominant-baseline="central">read-only boundary</text>
  <text class="ts tg2" x="340" y="284" text-anchor="middle" dominant-baseline="central">no execution</text>
</g>
<line x1="250" y1="242" x2="266" y2="242" class="arr" marker-end="url(#xrk-arrow2)"/>
<line x1="410" y1="242" x2="426" y2="242" class="arr" marker-end="url(#xrk-arrow2)"/>

<rect class="zone" x="438" y="68" width="210" height="364" rx="12" opacity="0.5"/>
<rect class="zone" x="430" y="60" width="210" height="364" rx="12" fill="var(--bg-000,#fff)"/>
<text class="th zl" x="446" y="84">AI clients — execution</text>

<g>
  <rect class="bt" x="450" y="96" width="170" height="56" rx="8"/>
  <text class="th tt1" x="535" y="114" text-anchor="middle" dominant-baseline="central">Skill execution</text>
  <text class="ts tt2" x="535" y="134" text-anchor="middle" dominant-baseline="central">runs locally</text>
</g>
<g>
  <rect class="bg" x="450" y="166" width="170" height="56" rx="8"/>
  <text class="th tg1" x="535" y="184" text-anchor="middle" dominant-baseline="central">Client tools</text>
  <text class="ts tg2" x="535" y="204" text-anchor="middle" dominant-baseline="central">side effects stay here</text>
</g>
<g>
  <rect class="bg" x="450" y="236" width="170" height="56" rx="8"/>
  <text class="th tg1" x="535" y="254" text-anchor="middle" dominant-baseline="central">Evidence</text>
  <text class="ts tg2" x="535" y="274" text-anchor="middle" dominant-baseline="central">records judgments</text>
</g>
<g>
  <rect class="bg" x="450" y="306" width="170" height="56" rx="8"/>
  <text class="th tg1" x="535" y="324" text-anchor="middle" dominant-baseline="central">Closure / gates</text>
  <text class="ts tg2" x="535" y="344" text-anchor="middle" dominant-baseline="central">verified, then closed</text>
</g>

<g>
  <rect class="bg" x="40" y="444" width="600" height="36" rx="8"/>
  <text class="ts tg1" x="340" y="462" text-anchor="middle" dominant-baseline="central">The server delivers the same governed assets; each client executes locally</text>
</g>
</svg>
