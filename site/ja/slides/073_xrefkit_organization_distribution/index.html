<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XRefKit 組織配布</title>
  <link rel="stylesheet" href="../../../assets/common.css" />
  <style>
    body { margin: 0; font-family: Inter, "Noto Sans JP", sans-serif; background: #f8f9fa; color: #0f172a; }
    main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }
    h1 { margin: 0 0 12px; font-size: 40px; }
    .lead { font-size: 18px; line-height: 1.6; color: #475569; }
    .entry { margin-top: 28px; padding: 20px; border: 1px solid #dbe3ee; border-radius: 8px; background: #fff; }
    .entry p { font-size: 18px; line-height: 1.6; color: #475569; }
    img { display: block; width: 100%; margin-top: 16px; border-radius: 8px; border: 1px solid #dbe3ee; }
    .order { color: #2563eb; font-size: 15px; font-weight: 800; letter-spacing: 0; }
  </style>
</head>
<body>
  <main>
    <h1>XRefKit 改善と組織配布</h1>
    <p class="lead">実行状況ダッシュボードで実行記録とXID利用を観測し、人間が改善対象を判断して、検証した次版をAI利用環境へ届ける循環を説明します。</p>
    <nav data-xrefkit-navigation="073" aria-label="資料ナビゲーション"></nav>
    <div id="slides"></div>
  </main>
  <script src="../../../assets/xrefkit-information-model.js"></script>
  <script>
    const slides = [
      ["01a", "01_title_q", "多くの責務実行から、改善すべき実行をどう見つけるのですか。"],
      ["01b", "01_title", "実行状況ダッシュボードが、改善判断の入口になります。"],
      ["02a", "02_unit_q", "一覧では、どの状態を確認対象にするのですか。"],
      ["02b", "02_unit", "停止、終了確認、品質確認、不足情報から対象を絞ります。"],
      ["03a", "03_package_q", "一件の責務実行では、何を確認するのですか。"],
      ["03b", "03_package", "作業、証跡、懸念、終了判定を一件単位で確認します。"],
      ["04a", "04_generation_q", "どのKnowledgeが選ばれ、実際に使われたか分かりますか。"],
      ["04b", "04_generation", "実行識別子で記録を結び、XIDの利用段階を分けます。"],
      ["05a", "05_providers_q", "改善判断に必要な記録が足りない場合は、どう分かりますか。"],
      ["05b", "05_providers", "不足情報と相関の切れ目を、実行横断で順位付けします。"],
      ["06a", "06_mcp_q", "実行状況ダッシュボードが、KnowledgeやSkillを自動で直すのですか。"],
      ["06b", "06_mcp", "観測結果から何を直すかは、人間が判断します。"],
      ["07a", "07_bootstrap_q", "判断した改善を、次の版へどう反映するのですか。"],
      ["07b", "07_bootstrap", "正本を改訂し、検証と人間の承認を通して次版にします。"],
      ["08a", "08_conclusion_q", "検証された次版は、改善されたとどう確認するのですか。"],
      ["08b", "08_conclusion", "次版を配布し、次の責務実行を再び観測します。"],
    ];
    const container = document.getElementById("slides");
    for (const [order, file, text] of slides) {
      const section = document.createElement("section");
      section.className = "entry";
      if (file === "01_title") section.id = "improvement-distribution";
      const number = document.createElement("div");
      number.className = "order";
      number.textContent = order;
      const description = document.createElement("p");
      description.textContent = text;
      const image = document.createElement("img");
      image.setAttribute("src", `../../assets/073_xrefkit_organization_distribution/${file}.png`);
      image.alt = text;
      section.append(number, description, image);
      container.append(section);
    }
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  </script>
</body>
</html>
