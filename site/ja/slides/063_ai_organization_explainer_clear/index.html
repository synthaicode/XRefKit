<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRefKitの業務実行モデル</title><link rel="stylesheet" href="../../../assets/common.css"><style>
body{margin:0;font-family:Inter,"Noto Sans JP",sans-serif;background:#f8f9fa;color:#0f172a}main{max-width:1180px;margin:0 auto;padding:32px 24px 80px}h1{margin:0 0 12px;font-size:40px}.viewer{background:#fff;border:1px solid #dbe3ee;border-radius:8px;padding:16px}img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:white;border-radius:6px;border:1px solid #dbe3ee}.controls{display:flex;gap:12px;align-items:center;margin-top:14px}button{min-width:92px;padding:10px 14px;border:0;border-radius:6px;background:#2563eb;color:white;font-size:16px;font-weight:700;cursor:pointer}button.secondary{background:#475569}.counter{color:#475569;font-weight:700}.narration{margin-top:16px;padding:18px;border-left:4px solid #2563eb;background:#eff6ff;border-radius:6px;color:#0f172a;font-size:18px;line-height:1.65}</style></head>
<body><main><h1>XRefKitの業務実行モデル</h1><p>GoalからHuman acceptanceまで、限定責務をどう接続するかを説明します。</p><nav data-xrefkit-navigation="063" aria-label="資料ナビゲーション"></nav><section class="viewer"><img id="slide" src="../../assets/063_ai_organization_explainer_clear/01_title.png" alt="Goalから人間による受入れまでを接続する業務実行モデル"><div class="controls"><button class="secondary" id="prev">前へ</button><button id="next">次へ</button><span class="counter" id="counter"></span></div><div class="narration" id="narration"></div></section></main>
<script>
const slides=[
["01_title.png","Goal、Semantic routing、Skill、Knowledge、Workflow protocol、Evidence、Human acceptance、Handoffを接続します。"],
["02_team_definition.png","Goalは達成状態と受入条件を保持し、一つのSkillの終了だけでは完了しません。"],
["03_problem.png","Goalへ進む作業を、判断方法、入出力、Knowledge、Handoff境界を持つSkillへ分けます。"],
["03_prompt_skill_limit.png","GoalとSkillを、Semantic routingとEvidenceで接続します。"],
["04_work.png","Skillは目的、判断範囲、入力、出力、Knowledge、Handoff境界を持つ限定責務です。"],
["05_not_one_ai.png","Semantic routingはGoalと現在状態から、次に必要なSkillを選びます。"],
["06_repository.png","Skillは方法を持ち、Knowledgeは判断材料を持ちます。必要なXIDだけを読みます。"],
["07_handoff.png","Workflow protocolは作業項目、成果物、Evidence、unknown、risk、judgment、Handoffを記録します。"],
["08_burden_flow.png","GoalからHandoffまでを接続し、未完了を成功扱いにしません。"],
["08_or_team.png","進行検証 は作業記録の完全性を検査します。成果物の受入れは 品質確認 と人が別に判断します。"],
["09_value.png","AIが止まってもEvidenceから再開またはHandoffできます。Goalは受入条件が満たされるまで続きます。"],
["10_conclusion.png","人はGoalの達成、Human acceptance、承認、例外を担い、すべてを会話履歴から監視しません。"],
["11_before_after.png","単発の会話から、継続可能で監査可能な業務実行へ変えます。"],
["12_license.png","AI を止めないためではなく、止まっても仕事を失わないための仕組みです。"]
].map(([file,narration])=>[`../../assets/063_ai_organization_explainer_clear/${file}`,narration]);
const hashMap={"#goal":1,"#skill":3,"#semantic-routing":5,"#knowledge":6,"#workflow-protocol":7,"#evidence":9};
let index=hashMap[location.hash]??0;const image=document.getElementById("slide"),narration=document.getElementById("narration"),counter=document.getElementById("counter");function render(){image.src=slides[index][0];image.alt=slides[index][1];narration.textContent=slides[index][1];counter.textContent=`${index+1} / ${slides.length}`;}function selectHash(){if(hashMap[location.hash]!==undefined){index=hashMap[location.hash];render();}}document.getElementById("prev").onclick=()=>{index=Math.max(0,index-1);render()};document.getElementById("next").onclick=()=>{index=Math.min(slides.length-1,index+1);render()};addEventListener("hashchange",selectHash);render();
</script><script src="../../../assets/xrefkit-information-model.js"></script></body></html>
