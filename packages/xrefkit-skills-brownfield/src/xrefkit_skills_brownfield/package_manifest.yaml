package_id: xrefkit.skills.brownfield
package_type: skill_package
version: 0.1.0

requires:
  xrefkit_core: ">=0.4.3 <0.5.0"

provides:
  skills:
    - id: brownfield.workflow
      xid: xid-skill-brownfield-workflow
      path: skills/brownfield_workflow.skill.yaml
      contract_role: base_skill
      required_outputs:
        - phase_summary
        - traced_items
        - decisions
        - unknowns
        - evidence
        - phase_gates
        - handoffs
        - knowledge_basis
        - pattern_decisions
        - knowledge_import_results
        - file_edit_integrity_record
        - file_edit_round_trip_verification
        - file_edit_concurrency_revision_check
        - file_edit_specification_alignment
        - file_edit_historical_conflict_investigation
        - file_edit_uncommitted_state_classification
        - new_file_extension_conformity
        - new_file_code_rule_majority_by_scope
        - scope_adjusted_dfd_views
        - entity_change_point_mappings
        - entity_lifecycle_and_status_propagation
        - test_investigation_scope
        - existing_data_investigation_method
        - change_based_test_suite
        - test_structure_impact_mapping
        - overview_detail_report
      required_knowledge:
        - xid-7A2F4C8D1401
        - xid-7A2F4C8D1501
        - xid-8C4D2A7E5102
        - xid-7A2F4C8D1701
        - xid-7A2F4C8D2201
        - xid-7A2F4C8D2301
      required_review_axes:
        - xid-axis-brownfield-traceability
        - xid-axis-brownfield-unknown-visibility
        - xid-axis-brownfield-phase-completeness
      must_not:
        - treat_existing_implementation_as_business_truth
        - hide_unresolved_items
        - invent_missing_behavior
        - create_untraced_work
        - prepare_test_tools_only_during_test_execution
        - hand_off_unreviewed_design
        - approve_human_owned_decisions

    - id: brownfield.execution_planning
      xid: xid-skill-brownfield-execution-planning
      path: skills/brownfield_execution_planning.skill.yaml
      contract_role: planning_skill
      required_outputs:
        - phase_summary
        - execution_work_plan
        - xddp_change_requirement_specification
        - xddp_traceability_matrix
        - xddp_change_design_handoff
        - investigation_scope
        - target_dependency_map
        - existing_data_investigation_plan
        - pre_change_test_suite_plan
        - evidence_plan
        - phase_gates
        - unknowns
        - handoffs
      required_knowledge:
        - xid-7A2F4C8D1701
        - xid-7A2F4C8D1711
        - xid-7A2F4C8D2201
        - xid-7A2F4C8D2301
      required_review_axes: []
      must_not:
        - approve_human_owned_requirements
        - invent_missing_behavior
        - hide_unverified_scope
        - approve_release_or_residual_risk
        - execute_production_changes

    - id: brownfield.pattern_learning
      xid: xid-skill-brownfield-pattern-learning
      path: skills/brownfield_pattern_learning.skill.yaml
      contract_role: pattern_learning_skill
      required_outputs:
        - phase_summary
        - pattern_inventory
        - representative_peer_evidence
        - data_lifecycle_pattern_inventory
        - lifecycle_propagation_map
        - operational_baseline
        - complexity_delta
        - pattern_decision_basis
        - deviation_options
        - unknowns
        - handoffs
      required_knowledge:
        - xid-5F21C8A41001
        - xid-5F21C8A41002
        - xid-7A2F4C8D2201
        - xid-7A2F4C8D2301
        - xid-F9B3C6A70412
        - xid-7B3E5D1A6101
      required_review_axes: []
      must_not:
        - treat_one_example_as_repository_rule
        - infer_business_truth_from_code
        - approve_new_pattern_or_release
        - hide_complexity_or_operational_burden
        - optimize_abstract_elegance_over_operational_baseline

  fragments: []
  knowledge: []
  review_axes:
    - id: brownfield.traceability
      xid: xid-axis-brownfield-traceability
      path: review_axes/traceability.yaml
    - id: brownfield.unknown_visibility
      xid: xid-axis-brownfield-unknown-visibility
      path: review_axes/unknown_visibility.yaml
    - id: brownfield.phase_completeness
      xid: xid-axis-brownfield-phase-completeness
      path: review_axes/phase_completeness.yaml
  schemas: []
  templates: []

contract:
  can_be_extended_by_local_skill: true
  local_skill_can_weaken_contract: false
  local_can_weaken_required_outputs: false
  local_can_override_must_not: false
  requires_unknown_declaration: true
  requires_traceability: true
