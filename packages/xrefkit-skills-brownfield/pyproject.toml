[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrefkit-skills-brownfield"
version = "0.1.5"
description = "XRefKit brownfield requirements, planning, design, manufacturing, and testing Skill Package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "xrefkit>=0.6.1,<0.7.0"
]

[project.entry-points."xrefkit.skill_packages"]
brownfield = "xrefkit_skills_brownfield:package_root"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xrefkit_skills_brownfield" = [
  "package_manifest.yaml",
  "skills/*.yaml",
  "skills/**/*.md",
  "knowledge/**/*.md",
  "review_axes/*.yaml",
  "evaluation/**/*"
]
