  prohibited_action: do_not_use_force_to_bypass_environment_guard
  minimum_resume_evidence:
    - isolated_nonproduction_database_identity
    - tested_rollback_or_restore_procedure
    - side_effect_cleanup_or_disposition
    - child-procedure transaction and output trace
    - serialized input correlation key
    - approved expected-difference predicate
  handoff:
    - owner: environment_or_release_owner
      decision: authorize_safe_target_and_restore_plan
    - owner: business_owner
      decision: define_expected_tax_difference
    - owner: batch_implementation_owner
      decision: provide_transaction_and_result-correlation evidence
