# FLOW-DESIGN to the deterministic-control schema (docs/018,
# docs/073).
# Design produces approved_design — a human-owned commitment consumed by test and
# manufacturing — so it ends in a human approval gate.

flow_id: FLOW-DESIGN
name: design_workflow
doc_xid: 8B31F02A4015
phase: normal
owner:
  primary: design_group
runs_after:
  - FLOW-PLANNING
runs_before:
  - FLOW-TEST
  - FLOW-MANUFACTURING

inputs:
  - approved_requirements
  - work_plan
  - source_modification_policy
  - data_change_policy
  - planning_basis_source_list
outputs:
  - approved_design
  - target_paths
  - source_modification_design
  - data_change_design
  - design_basis_policy_reference
handoff:
  output_to:
    - FLOW-TEST
    - FLOW-MANUFACTURING
  artifacts:
    - approved_design
    - target_paths
    - source_modification_design
    - data_change_design
    - design_basis_policy_reference

  escalation:
    - scope_conflicts_to_coordinator
    - unresolved_design_assumptions_explicit
invariants:
  - design_realizes_planning_policies
  - unresolved_design_assumptions_must_remain_explicit

global_handback:
  uncertainty:
    to: coordinator
    ask: "resolve blocking unknown before continuing design"
    resume: solution_design_drafting

entry: confirm_planning_outputs_approved

steps:
  # ③ tool gate — confirm planning outputs are approved (input check).
  confirm_planning_outputs_approved:
    facets: [designer_persona, input_check_policy]
    permission: { edit: false }
    result_map: { complete: Go, blocked: Hold }
    on:
      Go: solution_design_drafting
      Hold:
        handback:
          to: coordinator
          reason: planning_not_approved
          ask: "planning outputs are not approved; cannot start design"
          resume:
            resolved: confirm_planning_outputs_approved
            rejected: ABORT
      _invalid_or_absent: ABORT

  # ② generation — solution design; review gate accepts.
  solution_design_drafting:
    facets: [designer_persona, design_policy]
    permission: { edit: false }
    capability: CAP-DSN-SOLUTION
    acceptance:
      - { review: independent_quality_review }
    on:
      Go: record_design_to_planning_trace
      Recycle: solution_design_drafting
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "solution design could not complete"
          resume:
            resolved: solution_design_drafting
            rejected: ABORT

  # ③ tool gate — record design-to-planning trace; needs_fix returns to drafting.
  record_design_to_planning_trace:
    facets: [designer_persona, trace_policy]
    permission: { edit: true, paths: ["work/design/**"] }
    result_map: { complete: Go, needs_fix: Recycle }
    on:
      Go: prepare_test_and_manufacturing_handoff
      Recycle: solution_design_drafting
      _invalid_or_absent: ABORT

  # ② generation — prepare the test/manufacturing handoff package; review accepts.
  prepare_test_and_manufacturing_handoff:
    facets: [designer_persona, handoff_policy]
    permission: { edit: false }
    capability: CAP-DSN-HANDOFF-PREP
    acceptance:
      - { review: independent_quality_review }
    on:
      Go: design_approval
      Recycle: prepare_test_and_manufacturing_handoff
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "handoff preparation could not complete"
          resume:
            resolved: prepare_test_and_manufacturing_handoff
            rejected: ABORT

  # ① human gate — approved_design is a human-owned commitment; approve before
  # handoff. Rework returns to drafting; scope conflict / rejection aborts.
  design_approval:
    facets: [designer_persona, approval_policy]
    permission: { edit: false }
    on:
      ready_for_approval:
        gate:
          to: design_group_owner
          ask: "approve the design before handoff to test and manufacturing"
          resume:
            approved: COMPLETE
            rework: solution_design_drafting
            rejected: ABORT
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "design approval handoff could not complete"
          resume:
            resolved: design_approval
            rejected: ABORT
