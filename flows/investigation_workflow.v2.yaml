# Pilot migration of FLOW-INVESTIGATION to the deterministic-control schema
# (docs/018, docs/073). Coexists with the legacy investigation_workflow.yaml
# (strangler migration).
#
# Every 作業 ends in an acceptance gate; the transition is the gate's canonical
# verdict (Go / Kill / Hold / Recycle). Gate kinds:
#   - evaluation steps (scope determination, evidence classification) → the
#     evaluation axis IS the gate; the capability emits the verdict directly.
#   - generation steps (source/dependency, change-target) → a separate review
#     gate (reviewer role ≠ executor) accepts the artifact (Go) or returns it
#     (Recycle).
#   - verify_coverage → a tool gate; result_map derives the verdict.
# Investigation determines scope — a human-owned commitment — so it ends in a
# human gate (scope_confirmation) before handing off downstream.

flow_id: FLOW-INVESTIGATION
name: investigation_workflow
doc_xid: 8B31F02A4001
phase: normal
owner:
  primary: planning_group
  support:
    - design_group
runs_after:
  - FLOW-APPLICATION
runs_before:
  - FLOW-ESTIMATION
  - FLOW-REQUIREMENTS
  - FLOW-PLANNING

inputs:
  - request
  - service_catalog_or_equivalent_domain_reference
  - repository_paths
  - source_code
  - design_materials
outputs:
  - in_scope_service_list
  - out_of_scope_service_list
  - change_viewpoints
  - test_viewpoints
  - change_target_list
  - consolidated_uncertainty_list
handoff:
  output_to:
    - FLOW-ESTIMATION
    - FLOW-REQUIREMENTS
    - design_group_support
  artifacts:
    - change_target_list
    - change_viewpoints
    - test_viewpoints
    - uncertainty_list

invariants:
  - does_not_decide_implementation_policy
  - does_not_decide_design_policy
  - missing_evidence_must_be_unknown

global_handback:
  uncertainty:
    to: coordinator
    ask: "resolve blocking unknown before continuing investigation"
    resume: service_catalog_analysis

entry: service_catalog_analysis

steps:
  # ② evaluation — scope determination. The evaluation axis (scope boundary) IS
  # the gate; the capability emits the verdict. No separate acceptance.
  service_catalog_analysis:
    facets: [investigator_persona, service_catalog_policy]
    permission: { edit: false }
    capability: CAP-INV-SERVICE-SCOPE
    on:
      Go: source_and_dependency_analysis
      Hold:
        handback:
          to: coordinator
          reason: out_of_scope_boundary
          ask: "confirm the out-of-scope boundary"
          resume:
            confirmed: source_and_dependency_analysis
            rescope: service_catalog_analysis
            rejected: ABORT
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "service-catalog analysis could not complete"
          resume:
            resolved: service_catalog_analysis
            rejected: ABORT

  # ② generation — change viewpoints + dependency analysis. Execution (executor)
  # produces the artifact; a separate review gate (reviewer role) accepts it.
  source_and_dependency_analysis:
    facets: [investigator_persona, source_analysis_policy]
    permission: { edit: false }
    capability: CAP-INV-SOURCE-DEPENDENCY
    acceptance:
      - { review: independent_quality_review }
    on:
      Go: change_target_summarization
      Recycle: source_and_dependency_analysis
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "source/dependency analysis could not complete"
          resume:
            resolved: source_and_dependency_analysis
            rejected: ABORT

  # ② generation — change target list + test viewpoints. Review gate accepts.
  change_target_summarization:
    facets: [investigator_persona, summarization_policy]
    permission: { edit: false }
    capability: CAP-INV-CHANGE-SUMMARY
    acceptance:
      - { review: independent_quality_review }
    on:
      Go: record_uncertainty_and_evidence_gaps
      Recycle: change_target_summarization
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "change-target summarization could not complete"
          resume:
            resolved: change_target_summarization
            rejected: ABORT

  # ② evaluation — classify evidence gaps as unknowns. Axis (evidence
  # sufficiency) is the gate; a blocking unknown holds for a human.
  record_uncertainty_and_evidence_gaps:
    facets: [investigator_persona, uncertainty_policy]
    permission: { edit: true, paths: ["work/investigation/**"] }
    capability: CAP-INV-UNCERTAINTY
    on:
      Go: verify_coverage
      Hold:
        handback:
          to: coordinator
          reason: blocking_unknown
          ask: "resolve a blocking unknown that prevents recording"
          resume:
            resolved: record_uncertainty_and_evidence_gaps
            rejected: ABORT
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "uncertainty recording could not complete"
          resume:
            resolved: record_uncertainty_and_evidence_gaps
            rejected: ABORT

  # ③ tool gate — every_coverage_area_must_be_recorded. result_map derives the
  # verdict from the coverage check (complete→Go, needs_fix→Recycle).
  verify_coverage:
    facets: [coverage_check_policy]
    permission: { edit: false }
    result_map: { complete: Go, needs_fix: Recycle }
    on:
      Go: scope_confirmation
      Recycle: change_target_summarization
      _invalid_or_absent: ABORT

  # ① human gate — scope is a human-owned commitment; confirm before handoff.
  scope_confirmation:
    facets: [scope_confirmation_policy]
    permission: { edit: false }
    on:
      ready_for_confirmation:
        gate:
          to: coordinator
          ask: "confirm investigation scope and change targets before downstream estimation/requirements"
          resume:
            confirmed: COMPLETE
            rescope: service_catalog_analysis
            rejected: ABORT
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "scope confirmation handoff could not complete"
          resume:
            resolved: scope_confirmation
            rejected: ABORT
