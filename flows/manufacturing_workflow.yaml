# FLOW-MANUFACTURING to the deterministic-control schema
# (docs/018, docs/073).
# Implementation is verified by deterministic tool gates (unit tests, trace) that
# Recycle back to implementation on failure. Quality feedback without a tradeoff
# is fixed by implementation; a tradeoff / scope conflict Holds to the coordinator.
# Internal self-check precedes external quality review (handoff).

flow_id: FLOW-MANUFACTURING
name: manufacturing_workflow
doc_xid: 8B31F02A4002
phase: normal
owner:
  primary: manufacturing_group
runs_after:
  - FLOW-DESIGN
  - FLOW-TEST
runs_before:
  - FLOW-RELEASE-PLANNING
  - qa_review

inputs:
  - approved_design
  - source_modification_design
  - data_change_design
  - test_design
  - target_paths
  - coding_rules
  - naming_rules
  - test_viewpoints
  - quality_feedback_items
  - test_design_basis_policy_reference
  - test_item_requirement_traceability_reference
  - manufacturing_test_review_result
  - design_basis_policy_reference
outputs:
  - implemented_code
  - unit_test_results
  - implementation_basis_design_reference
  - self_check_result
  - quality_feedback_response
  - unresolved_list
  - out_of_scope_list
  - unit_test_execution_basis_reference
  - uncertainty_list
handoff:
  output_to:
    - quality_group_review
    - FLOW-RELEASE-PLANNING
  artifacts:
    - implemented_code
    - unit_test_results
    - implementation_basis_design_reference
    - self_check_result
    - quality_feedback_response
    - unresolved_list
    - unit_test_execution_basis_reference
    - out_of_scope_list

  escalation:
    - implementation_assumption_gap_to_unknown_or_out_of_scope
    - out_of_scope_to_coordinator
    - quality_feedback_tradeoff_or_scope_conflict_to_coordinator
invariants:
  - stays_inside_approved_boundary
  - does_not_change_design_policy
  - implementation_assumption_gaps_must_be_recorded
  - pending_runtime_tests_do_not_block_source_quality_feedback
  - group_internal_self_check_before_external_review

global_handback:
  uncertainty:
    to: coordinator
    ask: "resolve blocking unknown before continuing manufacturing"
    resume: implementation

entry: confirm_approved_scope

steps:
  # ③ tool gate — confirm approved scope (input check).
  confirm_approved_scope:
    facets: [manufacturer_persona, input_check_policy]
    permission: { edit: false }
    result_map: { complete: Go, blocked: Hold }
    on:
      Go: classify_quality_feedback_items
      Hold:
        handback:
          to: coordinator
          reason: scope_not_approved
          ask: "approved scope is missing; cannot start manufacturing"
          resume:
            resolved: confirm_approved_scope
            rejected: ABORT
      _invalid_or_absent: ABORT

  # ② evaluation — classify quality feedback (tradeoff vs no-tradeoff is the axis).
  # No tradeoff proceeds to implementation; a tradeoff / scope conflict Holds.
  classify_quality_feedback_items:
    facets: [manufacturer_persona, feedback_classification_policy]
    permission: { edit: false }
    capability: CAP-MFG-CLASSIFY-FEEDBACK
    on:
      Go: implementation
      Hold:
        handback:
          to: coordinator
          reason: quality_feedback_tradeoff_or_scope_conflict
          ask: "quality feedback has a tradeoff or scope conflict; coordinator decides"
          resume:
            resolved: implementation
            rejected: ABORT
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "feedback classification produced no valid verdict"
          resume:
            resolved: classify_quality_feedback_items
            rejected: ABORT

  # ② generation — implement within the approved boundary; review gate accepts.
  implementation:
    facets: [manufacturer_persona, implementation_policy]
    permission: { edit: true, paths: ["src/**", "work/manufacturing/**"] }
    capability: CAP-MFG-IMPLEMENT
    acceptance:
      - { review: independent_quality_review }
    on:
      Go: unit_test_execution
      Recycle: implementation
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "implementation could not complete"
          resume:
            resolved: implementation
            rejected: ABORT

  # ③ tool gate — run unit tests; failures Recycle back to implementation.
  unit_test_execution:
    facets: [manufacturer_persona, unit_test_policy]
    permission: { edit: false }
    result_map: { complete: Go, needs_fix: Recycle }
    on:
      Go: record_implementation_to_design_trace
      Recycle: implementation
      _invalid_or_absent: ABORT

  # ③ tool gate — record the implementation-to-design trace.
  record_implementation_to_design_trace:
    facets: [manufacturer_persona, trace_policy]
    permission: { edit: true, paths: ["work/manufacturing/**"] }
    result_map: { complete: Go, needs_fix: Recycle }
    on:
      Go: return_quality_feedback_response
      Recycle: implementation
      _invalid_or_absent: ABORT

  # ② evaluation — respond to quality feedback. A tradeoff / scope conflict Holds.
  return_quality_feedback_response:
    facets: [manufacturer_persona, feedback_response_policy]
    permission: { edit: true, paths: ["work/manufacturing/**"] }
    capability: CAP-MFG-FEEDBACK-RESPONSE
    on:
      Go: quality_source_recheck_or_redisposition
      Hold:
        handback:
          to: coordinator
          reason: quality_feedback_tradeoff_or_scope_conflict
          ask: "feedback response hits a tradeoff or scope conflict; coordinator decides"
          resume:
            resolved: quality_source_recheck_or_redisposition
            rejected: ABORT
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "feedback response produced no valid verdict"
          resume:
            resolved: return_quality_feedback_response
            rejected: ABORT

  # ② evaluation — recheck/redispose the quality source after the fix (the source
  # quality axis is the gate). Redisposition that needs more code Recycles.
  quality_source_recheck_or_redisposition:
    facets: [manufacturer_persona, quality_source_policy]
    permission: { edit: false }
    capability: CAP-MFG-QUALITY-RECHECK
    on:
      Go: manufacturing_self_check
      Recycle: implementation
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "quality source recheck produced no valid verdict"
          resume:
            resolved: quality_source_recheck_or_redisposition
            rejected: ABORT

  # ② evaluation — group-internal self check before external review (the axis is
  # the gate). A failing self check Recycles to implementation.
  manufacturing_self_check:
    facets: [manufacturer_persona, self_check_policy]
    permission: { edit: false }
    capability: CAP-MFG-SELF-CHECK
    on:
      Go: handoff_to_quality_review
      Recycle: implementation
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "self check produced no valid verdict"
          resume:
            resolved: manufacturing_self_check
            rejected: ABORT

  # ③ tool gate — assemble and hand off to external quality review.
  handoff_to_quality_review:
    facets: [manufacturer_persona, handoff_policy]
    permission: { edit: true, paths: ["work/manufacturing/**"] }
    result_map: { complete: Go, needs_fix: Recycle }
    on:
      Go: COMPLETE
      Recycle: manufacturing_self_check
      _invalid_or_absent: ABORT
