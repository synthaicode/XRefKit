# FLOW-REQUIREMENTS to the deterministic-control schema
# (docs/018, docs/073).
# Requirements is draft_only — it does not approve, so it ends deterministically;
# unresolved requirement questions / out-of-scope Hold to a human.

flow_id: FLOW-REQUIREMENTS
name: requirements_workflow
doc_xid: 8B31F02A4005
phase: normal
owner:
  primary: planning_group
  support:
    - design_group
runs_after:
  - FLOW-ESTIMATION
  - FLOW-INVESTIGATION
runs_before:
  - FLOW-PLANNING

inputs:
  - confirmed_assumptions
  - change_target_list
  - change_test_viewpoint_table
outputs:
  - requirement_draft
  - performance_requirement_definition
  - unresolved_evidence_list
handoff:
  output_to:
    - FLOW-PLANNING
    - manufacturing_scope_definition
  artifacts:
    - requirement_draft
    - performance_requirement_definition
    - unresolved_evidence_list

  escalation:
    - out_of_scope_to_coordinator
    - unresolved_requirement_questions_for_review_or_approval
invariants:
  - draft_only
  - unresolved_items_must_remain_explicit

global_handback:
  uncertainty:
    to: coordinator
    ask: "resolve blocking unknown before continuing requirements"
    resume: confirm_unresolved_assumptions_reviewed

entry: confirm_unresolved_assumptions_reviewed

steps:
  # ③ tool gate — confirm upstream assumptions were reviewed (input check).
  confirm_unresolved_assumptions_reviewed:
    facets: [requirements_persona, input_check_policy]
    permission: { edit: false }
    result_map: { complete: Go, blocked: Hold }
    on:
      Go: requirement_draft_creation
      Hold:
        handback:
          to: coordinator
          reason: assumptions_not_reviewed
          ask: "upstream assumptions are not reviewed; cannot start requirements"
          resume:
            resolved: confirm_unresolved_assumptions_reviewed
            rejected: ABORT
      _invalid_or_absent: ABORT

  # ② generation — requirement draft; review gate accepts.
  requirement_draft_creation:
    facets: [requirements_persona, requirement_policy]
    permission: { edit: false }
    capability: CAP-REQ-001
    acceptance:
      - { review: independent_quality_review }
    on:
      Go: performance_requirement_definition
      Recycle: requirement_draft_creation
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "requirement draft could not complete"
          resume:
            resolved: requirement_draft_creation
            rejected: ABORT

  # ② generation — performance requirements; review gate accepts.
  performance_requirement_definition:
    facets: [requirements_persona, performance_policy]
    permission: { edit: false }
    capability: CAP-REQ-002
    acceptance:
      - { review: independent_quality_review }
    on:
      Go: preserve_unresolved_evidence_gaps
      Recycle: performance_requirement_definition
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "performance requirement definition could not complete"
          resume:
            resolved: performance_requirement_definition
            rejected: ABORT

  # ② evaluation — preserve unresolved evidence gaps; evidence sufficiency axis is
  # the gate. Unresolved questions Hold for review/approval; otherwise done.
  preserve_unresolved_evidence_gaps:
    facets: [requirements_persona, uncertainty_policy]
    permission: { edit: true, paths: ["work/requirements/**"] }
    on:
      Go: COMPLETE
      Hold:
        handback:
          to: coordinator
          reason: unresolved_requirement_questions
          ask: "unresolved requirement questions need review or approval"
          resume:
            resolved: preserve_unresolved_evidence_gaps
            rejected: ABORT
      _invalid_or_absent:
        handback:
          to: coordinator
          ask: "evidence-gap preservation produced no valid verdict"
          resume:
            resolved: preserve_unresolved_evidence_gaps
            rejected: ABORT
