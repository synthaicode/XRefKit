<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>:root { --ink:#172033; --muted:#52657c; --blue:#2563eb; --blue-soft:#eaf1ff; --green:#15803d; --green-soft:#e8f7ee; --amber:#b45309; --amber-soft:#fff3dc; --red:#be123c; --red-soft:#fdeaf0; --line:#d6deea; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Inter","Noto Sans JP",sans-serif; color:var(--ink); background:#f7f9fc; }
.canvas { width:1600px; height:900px; padding:56px 72px; overflow:hidden; background:#f7f9fc; }
.eyebrow { color:var(--blue); font-size:24px; font-weight:800; }
h1 { margin:18px 0 0; max-width:1320px; font-size:68px; line-height:1.12; letter-spacing:0; }
.lead { margin:22px 0 0; max-width:1240px; color:var(--muted); font-size:31px; line-height:1.45; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:48px; }
.card { min-height:278px; padding:28px; border:2px solid var(--line); border-radius:14px; background:#fff; }
.card h2 { margin:0 0 16px; font-size:34px; line-height:1.2; }
.card p { margin:0; color:var(--muted); font-size:26px; line-height:1.42; }
.blue { border-color:#a8c4f5; background:var(--blue-soft); }.green { border-color:#9bd1aa; background:var(--green-soft); }.amber { border-color:#e8bf75; background:var(--amber-soft); }.red { border-color:#e5a5b6; background:var(--red-soft); }
.flow { display:flex; align-items:center; gap:14px; margin-top:55px; }.node { flex:1; min-height:152px; padding:24px; border:2px solid var(--line); border-radius:14px; background:#fff; text-align:center; font-size:31px; font-weight:800; line-height:1.25; }.node small { display:block; margin-top:12px; color:var(--muted); font-size:21px; font-weight:600; }.arrow { color:var(--blue); font-size:45px; font-weight:900; }.callout { margin-top:36px; padding:22px 28px; border-left:7px solid var(--blue); background:#fff; color:#26456e; font-size:28px; font-weight:750; line-height:1.4; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:46px; }.panel { min-height:350px; padding:30px; border:2px solid var(--line); border-radius:14px; background:#fff; }.panel h2 { margin:0 0 18px; font-size:42px; }.panel ul { margin:0; padding-left:28px; color:var(--muted); font-size:27px; line-height:1.6; }.metric { display:grid; grid-template-columns:140px 1fr; gap:18px; align-items:center; margin:15px 0; padding:16px; border-radius:10px; background:#f4f7fb; }.metric strong { color:var(--blue); font-size:25px; }.metric span { color:var(--muted); font-size:24px; line-height:1.35; }
.loop { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:50px; }.step { min-height:250px; padding:26px; border:2px solid var(--line); border-radius:14px; background:#fff; }.step b { display:block; color:var(--blue); font-size:24px; }.step h2 { margin:14px 0; font-size:34px; }.step p { margin:0; color:var(--muted); font-size:24px; line-height:1.4; }
.footer { position:absolute; left:72px; right:72px; bottom:48px; color:#26456e; font-size:28px; font-weight:800; }
</style></head><body><main class="canvas"><div class="eyebrow">改善ループ</div><h1>観測を、Skill と Knowledge の改善へ戻す</h1><section class="loop"><article class="step"><b>1. 記録</b><h2>実行を相関する</h2><p>run_id と XID の状態を残す。</p></article><article class="step"><b>2. 観測</b><h2>差分を見る</h2><p>unused、not loaded、not applied、不足情報を確認する。</p></article><article class="step"><b>3. 判断</b><h2>原因を選ぶ</h2><p>routing、Skill、Knowledge、記録方式を evidence で比較する。</p></article><article class="step"><b>4. 改善</b><h2>正本を直す</h2><p>承認後に Skill、Knowledge、catalog を更新し、次の Run で再観測する。</p></article></section><div class="footer">ログは監査の終点ではない。次の AI 作業を良くするための入力である。</div></main></body></html>
