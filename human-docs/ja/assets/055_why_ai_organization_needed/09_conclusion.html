<!doctype html><html lang="ja"><head><meta charset="utf-8" /><style>:root {
  --bg: linear-gradient(135deg, #f7fafc 0%, #eef4fb 100%);
  --panel: #ffffff;
  --ink: #132237;
  --muted: #62748a;
  --line: #d8e1eb;
  --primary: #2267d8;
  --primary-soft: #eaf1ff;
  --warning: #e28a2e;
  --warning-soft: #fff1de;
  --positive: #1b8f67;
  --positive-soft: #e8f7f0;
  --danger: #d44f4f;
  --danger-soft: #fcecec;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  color: var(--ink);
  background: #f7fafc;
  font-family: "Inter", "Noto Sans JP", sans-serif;
}

.canvas {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  padding: 56px 72px;
  background: #f7fafc;
}

.title {
  margin: 0;
  font-size: 64px;
  line-height: 1.15;
  letter-spacing: 0;
}

.subtitle {
  margin: 18px 0 0;
  color: var(--muted);
  font-size: 29px;
  line-height: 1.4;
}

.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); }

.card {
  min-height: 270px;
  padding: 28px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
}

.card h3 { margin: 0 0 18px; font-size: 34px; line-height: 1.2; color: var(--ink); }
.card p { margin: 0; color: var(--muted); font-size: 25px; line-height: 1.45; }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
.panel { min-height: 340px; padding: 28px; border: 2px solid var(--line); border-radius: 14px; background: var(--panel); }
.stack { display: grid; gap: 14px; margin-top: 22px; }
.box { padding: 18px 20px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font-size: 26px; font-weight: 700; line-height: 1.3; }
.badge { display: inline-block; padding: 9px 14px; border-radius: 999px; font-weight: 800; }
.b-blue { background: var(--primary-soft); color: var(--primary); }
.b-green { background: var(--positive-soft); color: var(--positive); }
.b-red { background: var(--danger-soft); color: var(--danger); }

.soft-blue { background: var(--primary-soft); border-color: #cfdcff; }
.soft-gray { background: #f3f6fa; border-color: #d7e0ea; }
.soft-orange { background: var(--warning-soft); border-color: #ffd8ad; }
.soft-green { background: var(--positive-soft); border-color: #bee8d9; }
.soft-red { background: var(--danger-soft); border-color: #f2c5c5; }

.summary-band {
  margin-top: 24px;
  padding: 24px 28px;
  border-radius: 24px;
  border: 2px solid #9fb9e8;
  background: #f7faff;
  text-align: center;
}

.summary-band strong {
  display: block;
  font-size: 34px;
  color: #234e95;
}

.summary-band span {
  display: block;
  margin-top: 10px;
  font-size: 22px;
  line-height: 1.45;
  color: #526985;
}

.big-arrow {
  display: flex;
  justify-content: center;
  margin-top: 18px;
  color: #6e8fbd;
  font-size: 88px;
  font-weight: 800;
  line-height: 1;
}

.hero-note {
  margin-top: 34px;
  padding: 24px 28px;
  border-radius: 24px;
  border: 1px solid #d8e1eb;
  background: rgba(255,255,255,0.84);
  box-shadow: 0 16px 34px rgba(21,34,53,0.08);
  text-align: center;
  font-size: 24px;
  line-height: 1.55;
  color: var(--muted);
}
</style></head><body>
    <div class="canvas"><h1 class="title">組織化とは、継続と改善の仕組みを持つこと</h1><p class="subtitle">速度だけでなく、再開、handoff、検証、改善までを仕事として扱う</p>
      <div class="grid-3" style="margin-top:96px;"><div class="card soft-blue"><h3>継続できる</h3><p>Goal とログから、途中で止まっても再開できる</p></div><div class="card soft-green"><h3>検証できる</h3><p>作業漏れと品質受入れを別々に確認できる</p></div><div class="card soft-orange"><h3>改善できる</h3><p>routing、Skill、Knowledge、XID利用を観測して直せる</p></div></div>
      <div class="summary-band"><strong>AI の速さを、手戻り削減と継続可能な業務実行へ変える</strong><span>それが、AI を組織化する目的である。</span></div></div></body></html>
