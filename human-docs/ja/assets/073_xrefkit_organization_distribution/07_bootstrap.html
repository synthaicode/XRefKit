<!doctype html><html lang="ja"><head><meta charset="utf-8" /><title>取得後に、ハッシュ、版、互換性を確認してから利用します。</title><style>:root {
  --bg: #f8f9fa;
  --panel: #ffffff;
  --ink: #0f172a;
  --muted: #475569;
  --line: #dbe3ee;
  --blue: #2563eb;
  --blue-soft: #eff6ff;
  --green: #0f766e;
  --amber: #b45309;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, "Noto Sans JP", sans-serif;
}

.slide {
  width: 1600px;
  height: 900px;
  padding: 44px 56px 0;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at top right, #dbeafe 0, transparent 28%),
    linear-gradient(180deg, #fafafa 0%, #f8f9fa 100%);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
}

.eyebrow {
  font-size: 24px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.title {
  margin: 10px 0 0;
  font-size: 46px;
  line-height: 1.12;
  font-weight: 900;
  max-width: 1120px;
}

.brand {
  padding: 10px 16px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-size: 24px;
  font-weight: 800;
}

.question-wrap {
  display: grid;
  place-items: center;
  height: 680px;
}

.question-box {
  max-width: 1100px;
  padding: 36px 44px;
  border-radius: 32px;
  background: var(--panel);
  border: 2px solid #bfdbfe;
  box-shadow: 0 24px 60px rgba(37, 99, 235, 0.08);
}

.question-label {
  font-size: 24px;
  font-weight: 800;
  color: var(--blue);
  margin-bottom: 14px;
}

.question-text {
  font-size: 60px;
  line-height: 1.2;
  font-weight: 800;
}

.summary {
  margin-top: 28px;
  padding: 22px 26px;
  border-radius: 24px;
  background: var(--panel);
  border: 1px solid var(--line);
}

.summary-label {
  font-size: 22px;
  font-weight: 800;
  color: var(--blue);
  margin-bottom: 10px;
}

.summary-title {
  font-size: 36px;
  line-height: 1.18;
  font-weight: 900;
}

.summary-copy {
  margin-top: 10px;
  font-size: 24px;
  line-height: 1.55;
  color: var(--muted);
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 22px;
}

.card {
  min-height: 220px;
  padding: 24px;
  border-radius: 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
}

.card-tag {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 18px;
  font-weight: 800;
  background: var(--blue-soft);
  color: var(--blue);
}

.card h3 {
  margin: 14px 0 10px;
  font-size: 28px;
  line-height: 1.25;
}

.card p {
  margin: 0;
  font-size: 22px;
  line-height: 1.5;
  color: var(--muted);
}

.takeaway {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 18px 56px 22px;
  background: var(--blue-soft);
  border-top: 4px solid var(--blue);
  font-size: 26px;
  line-height: 1.45;
  font-weight: 700;
}

.takeaway strong {
  color: var(--blue);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 18px;
}

.chip {
  padding: 10px 14px;
  border-radius: 999px;
  background: #ecfeff;
  color: var(--green);
  font-size: 20px;
  font-weight: 700;
}

.chip.warn {
  background: #fff7ed;
  color: var(--amber);
}
</style></head>
  <body><main class="slide"><header class="header"><div><div class="eyebrow">組織配布</div><h1 class="title">取得後に、ハッシュ、版、互換性を確認してから利用します。</h1></div><div class="brand">XRefKit</div></header>
  <section class="summary"><div class="summary-label">問い</div><div class="summary-copy">クライアントは、受け取った配布物をそのまま信頼するのですか。</div><div class="summary-title">パッケージの導入または必要資産の配置後に、内容ハッシュと版の条件を確認します。ネットワーク経由の信頼は配置環境の責任として扱います。</div></section>
  <section class="cards">
    <article class="card"><div class="card-tag">導入</div><p>Pythonパッケージとして導入するか、必要資産を配置します。</p></article>
    <article class="card"><div class="card-tag">整合性</div><p>マニフェスト、ハッシュ、版、拡張条件を確認します。</p></article>
    <article class="card"><div class="card-tag">信頼境界</div><p>通信、認証、配布元の信頼を配置環境で管理します。</p></article></section><div class="takeaway">配布できることと信頼できることを分け、<strong>利用前の検証</strong>を要求します。</div></main></body></html>
