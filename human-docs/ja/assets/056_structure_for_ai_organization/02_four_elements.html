<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>:root { --ink:#172033; --muted:#52657c; --line:#d6deea; --blue:#2563eb; --blue-soft:#eaf1ff; --green:#15803d; --green-soft:#e8f7ee; --amber:#b45309; --amber-soft:#fff3dc; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Inter","Noto Sans JP",sans-serif; color:var(--ink); background:#f7f9fc; }
.canvas { width:1600px; height:900px; overflow:hidden; padding:58px 72px; background:#f7f9fc; }
h1 { margin:0; max-width:1360px; font-size:68px; line-height:1.12; letter-spacing:0; }
.lead { margin:20px 0 0; color:var(--muted); font-size:31px; line-height:1.4; }
.grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; margin-top:72px; }
.card { min-width:0; min-height:300px; padding:30px; border:2px solid var(--line); border-radius:14px; background:#fff; }.card.blue { background:var(--blue-soft); border-color:#b8cffd; }.card.green { background:var(--green-soft); border-color:#b7e2c2; }.card.amber { background:var(--amber-soft); border-color:#ead096; }
.card h2 { margin:0 0 18px; overflow-wrap:anywhere; font-size:36px; line-height:1.2; }.card p { margin:0; overflow-wrap:anywhere; color:var(--muted); font-size:26px; line-height:1.45; }
.summary { margin-top:38px; padding:25px 30px; border:2px solid #a9c3ef; border-radius:14px; background:#fff; color:#234e95; text-align:center; font-size:32px; font-weight:800; line-height:1.35; }
</style></head><body><div class="canvas"><h1>semantic routing が、責務間をGoalへつなぐ</h1><p class="lead">Goalと現在状態から、次に必要なSkillを選ぶ</p><div class="grid"><section class="card blue"><h2>現在状態</h2><p>何が終わり、何が未了か</p></section><section class="card blue"><h2>routing</h2><p>次に必要な責務を選ぶ</p></section><section class="card green"><h2>次のSkill Run</h2><p>Goal達成まで進行を続ける</p></section></div><div class="summary">作業の分割は、全体の目的を失うことを意味しない。</div></div></body></html>
