<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 組織説明プレビュー</title><style>
body{margin:0;font-family:"Segoe UI","Yu Gothic UI",sans-serif;background:#0f172a;color:#f8fafc}main{max-width:1180px;margin:0 auto;padding:28px 20px 48px}h1{margin:0 0 20px;font-size:28px}.viewer{background:#111827;border:1px solid #334155;border-radius:8px;padding:16px}img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:white;border-radius:6px}.controls{display:flex;gap:12px;align-items:center;margin-top:14px}button{min-width:92px;padding:10px 14px;border:0;border-radius:6px;background:#2563eb;color:white;font-size:16px;font-weight:700;cursor:pointer}button.secondary{background:#475569}.counter{color:#cbd5e1;font-weight:700}.narration{margin-top:16px;padding:18px;border-left:5px solid #60a5fa;background:#1e293b;border-radius:6px;font-size:18px;line-height:1.65}</style></head>
<body><main><h1>AI 組織説明プレビュー</h1><section class="viewer"><img id="slide" src="../../assets/063_ai_organization_explainer_clear/01_title.png" alt=""><div class="controls"><button class="secondary" id="prev">前へ</button><button id="next">次へ</button><span class="counter" id="counter"></span></div><div class="narration" id="narration"></div></section></main>
<script>
const slides=[
["01_title.png","AI は個人作業を速くします。しかし、確認、判断、引き継ぎまで終わったとは限りません。"],
["02_team_definition.png","AI が途中で止まると、未了の作業、未確認点、根拠、次の担当が会話に埋もれます。"],
["03_problem.png","プロンプトだけでは、人が毎回説明し、何が終わったかを判断します。"],
["03_prompt_skill_limit.png","Goal は最終状態と受入条件を固定し、Skill は途中で担う責務を限定します。"],
["04_work.png","Skill は判断方法、入出力、必要な Knowledge、handoff 境界を持つ責務単位です。"],
["05_not_one_ai.png","semantic routing は Goal と現在状態から、次に必要な Skill を選びます。"],
["06_repository.png","Skill は方法を持ち、Knowledge は判断材料を持ちます。必要な XID だけを選んで読みます。"],
["07_handoff.png","workflow protocol は各 Skill Run の work item、成果物、根拠、unknown、handoff を記録します。"],
["08_burden_flow.png","Goal、routing、Skill Run、verify、handoff をつなぎ、未完了を成功扱いにしません。"],
["08_or_team.png","verify は作業記録の完全性を検査します。成果物の受入れは quality review と人が別に判断します。"],
["09_value.png","AI が止まっても、run log から再開または handoff できます。Goal は受入条件が満たされるまで続きます。"],
["10_conclusion.png","人は Goal、受入れ、承認、例外を担い、すべてを会話履歴から監視しません。"],
["11_before_after.png","単発の会話から、継続可能で監査可能な業務実行へ変えます。"],
["12_license.png","AI を止めないためではなく、止まっても仕事を失わないための仕組みです。"]
].map(([file,narration])=>[`../../assets/063_ai_organization_explainer_clear/${file}`,narration]);
let index=0;const image=document.getElementById("slide"),narration=document.getElementById("narration"),counter=document.getElementById("counter");function render(){image.src=slides[index][0];narration.textContent=slides[index][1];counter.textContent=`${index+1} / ${slides.length}`;}document.getElementById("prev").onclick=()=>{index=Math.max(0,index-1);render()};document.getElementById("next").onclick=()=>{index=Math.min(slides.length-1,index+1);render()};render();
</script></body></html>
