<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRefKitの業務実行モデル</title><link rel="stylesheet" href="../../../assets/common.css"><style>
body{margin:0;font-family:"Segoe UI","Yu Gothic UI",sans-serif;background:#0f172a;color:#f8fafc}main{max-width:1180px;margin:0 auto;padding:28px 20px 48px}h1{margin:0 0 20px;font-size:28px}.viewer{background:#111827;border:1px solid #334155;border-radius:8px;padding:16px}img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:white;border-radius:6px}.controls{display:flex;gap:12px;align-items:center;margin-top:14px}button{min-width:92px;padding:10px 14px;border:0;border-radius:6px;background:#2563eb;color:white;font-size:16px;font-weight:700;cursor:pointer}button.secondary{background:#475569}.counter{color:#cbd5e1;font-weight:700}.narration{margin-top:16px;padding:18px;border-left:5px solid #60a5fa;background:#1e293b;border-radius:6px;font-size:18px;line-height:1.65}</style></head>
<body><main><h1>XRefKitの業務実行モデル</h1><p>GoalからHuman acceptanceまで、限定責務をどう接続するかを説明します。</p><nav data-xrefkit-navigation="063" aria-label="資料ナビゲーション"></nav><section class="viewer"><img id="slide" src="../../assets/063_ai_organization_explainer_clear/01_title.png" alt="Goalから人間による受入れまでを接続する業務実行モデル"><div class="controls"><button class="secondary" id="prev">前へ</button><button id="next">次へ</button><span class="counter" id="counter"></span></div><div class="narration" id="narration"></div></section></main>
<script>
const slides=[
["01_title.png","目標、次作業選択、責務実行、作業進行規約、受入れを接続し、個別作業を業務完了までつなぎます。"],
["02_team_definition.png","目標 は 達成状態 と 受入条件 を保持し、個別責務の終了だけでは完了しません。"],
["03_problem.png","目標へ進む作業を、判断方法、入出力、組織固有知識、引継ぎ境界を持つ限定責務へ分けます。"],
["03_prompt_skill_limit.png","目標 は最終状態と受入条件を固定し、責務 は途中で担う責務を限定します。"],
["04_work.png","責務 は判断方法、入出力、必要な 組織固有知識、引継ぎ 境界を持つ責務単位です。"],
["05_not_one_ai.png","意味による次作業選択 は 目標 と現在状態から、次に必要な 責務 を選びます。"],
["06_repository.png","責務 は方法を持ち、組織固有知識 は判断材料を持ちます。必要な XID だけを選んで読みます。"],
["07_handoff.png","作業進行規約 は各 責務実行 の 作業項目、成果物、根拠、未確定事項、引継ぎ を記録します。"],
["08_burden_flow.png","目標、次作業選択、責務実行、進行検証、引継ぎ をつなぎ、未完了を成功扱いにしません。"],
["08_or_team.png","進行検証 は作業記録の完全性を検査します。成果物の受入れは 品質確認 と人が別に判断します。"],
["09_value.png","AI が止まっても、実行記録 から再開または 引継ぎ できます。目標 は受入条件が満たされるまで続きます。"],
["10_conclusion.png","人は 目標、受入れ、承認、例外を担い、すべてを会話履歴から監視しません。"],
["11_before_after.png","単発の会話から、継続可能で監査可能な業務実行へ変えます。"],
["12_license.png","AI を止めないためではなく、止まっても仕事を失わないための仕組みです。"]
].map(([file,narration])=>[`../../assets/063_ai_organization_explainer_clear/${file}`,narration]);
let index=0;const image=document.getElementById("slide"),narration=document.getElementById("narration"),counter=document.getElementById("counter");function render(){image.src=slides[index][0];image.alt=slides[index][1];narration.textContent=slides[index][1];counter.textContent=`${index+1} / ${slides.length}`;}document.getElementById("prev").onclick=()=>{index=Math.max(0,index-1);render()};document.getElementById("next").onclick=()=>{index=Math.min(slides.length-1,index+1);render()};render();
</script><script src="../../../assets/xrefkit-information-model.js"></script></body></html>
